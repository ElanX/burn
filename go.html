<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in Robinhood</title>
<style>
  html,body{margin:0;padding:0;background:#0b0b0d;color:#f2f2f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;}
  .brand{font-size:15px;letter-spacing:.14em;color:#ff8a3c;font-weight:700;margin-bottom:28px;}
  .ticker{font-size:44px;font-weight:800;letter-spacing:.02em;margin:0 0 8px;}
  .sub{font-size:16px;color:#9a9aa2;margin:0 0 32px;}
  a.open{display:block;width:100%;max-width:340px;background:#00c805;color:#04150a;font-size:19px;font-weight:700;text-decoration:none;padding:16px 20px;border-radius:999px;box-sizing:border-box;}
  .note{font-size:13px;color:#6d6d76;margin-top:22px;max-width:320px;line-height:1.45;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">$TOCKBURN</div>
  <p class="ticker" id="ticker">Robinhood</p>
  <p class="sub">Open this stock in the Robinhood app</p>
  <a class="open" id="openBtn" href="https://robinhood.com/">Open in Robinhood</a>
  <p class="note">iOS only hands you to the app from a real tap here, which is why this extra step exists.</p>
</div>
<script>
  (function () {
    var sym = "";
    try {
      var raw = new URLSearchParams(location.search).get("sym") || "";
      raw = raw.toUpperCase();
      if (/^[A-Z0-9.]{1,10}$/.test(raw)) sym = raw;
    } catch (e) {}
    if (sym) {
      document.getElementById("ticker").textContent = sym;
      document.getElementById("openBtn").href = "https://robinhood.com/us/en/stocks/" + sym + "/";
    }
  })();
</script>
</body>
</html>
