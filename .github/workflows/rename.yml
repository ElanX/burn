name: rename
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "ElanX"
          git config user.email "ElanX@users.noreply.github.com"
          git mv index.html marketheat.html
          git checkout HEAD~1 -- index.html
          git add -A
          git commit -m "Move new build to marketheat.html, restore previous index.html"
          git push
