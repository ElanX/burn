name: Replace index with MarketHeat build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with marketheat.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f marketheat.html ]; then echo "No marketheat.html to promote"; exit 0; fi
          git rm -q index.html
          git mv marketheat.html index.html
          git commit -m "Replace index.html with new MarketHeat build"
          git push
