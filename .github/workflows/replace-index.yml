name: Replace index
on:
  push:
    branches: [main]
    paths:
      - 'marketheat.html'
      - '.github/workflows/replace-index.yml'
jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with marketheat.html
        run: |
          if [ ! -f marketheat.html ]; then echo "No marketheat.html, nothing to do"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q index.html
          git mv marketheat.html index.html
          git commit -m "Update MarketHeat"
          git push
