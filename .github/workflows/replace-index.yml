name: Replace index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'marketheat.html'
      - '.github/workflows/replace-index.yml'

permissions:
  contents: write

jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with marketheat.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q index.html
          git mv marketheat.html index.html
          git commit -m "Replace index.html with latest MarketHeat build"
          git push
